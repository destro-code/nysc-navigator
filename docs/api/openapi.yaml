openapi: 3.1.0
info:
  title: NYSC Navigator API
  version: 0.1.0
  summary: Initial API contract used for API-first development.
servers:
  - url: https://api.nysc-navigator.example.com/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Forum
  - name: Notifications
  - name: Admin
  - name: Support

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /forum/posts:
    get:
      tags: [Forum]
      summary: List forum posts
      operationId: listPosts
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
    post:
      tags: [Forum]
      summary: Create a forum post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for current user
      operationId: listNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /admin/reports/{reportId}/resolve:
    post:
      tags: [Admin]
      summary: Resolve a moderation report
      operationId: resolveReport
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: Report resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /support/tickets:
    post:
      tags: [Support]
      summary: Create support ticket
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 2

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [corps_member, admin, support_agent]

    CreatePostRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 4
        body:
          type: string
          minLength: 10

    Post:
      type: object
      required: [id, authorId, title, body, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [published, flagged, removed]
        createdAt:
          type: string
          format: date-time

    PostListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Notification:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [forum_reply, moderation_update, support_update, system]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [dismissed, warning_issued, content_removed, user_suspended]
        note:
          type: string

    Report:
      type: object
      required: [id, postId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, resolved]
        createdAt:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [subject, message]
      properties:
        subject:
          type: string
        message:
          type: string

    SupportTicket:
      type: object
      required: [id, requesterId, subject, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        createdAt:
          type: string
          format: date-time
